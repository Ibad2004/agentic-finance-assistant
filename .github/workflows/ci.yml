name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_agent_test
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-only-32chars
          GROQ_API_KEY: placeholder
        run: alembic upgrade head

      - name: Seed transaction categories
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_agent_test
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-only-32chars
          GROQ_API_KEY: placeholder
        run: python scripts/seed_categories.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_agent_test
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-only-32chars
          GROQ_API_KEY: placeholder
          PYTHONPATH: "."
        run: python -m pytest -q
